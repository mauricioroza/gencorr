name: Python unit tests
# Fast checks of bin/ scripts (harmonizer, parsers, schema, comparison tool).
# Oracle tests against LDSC/LAVA need those tools and run inside the containers
# (see docs/validation.md); they are skipped here automatically.
on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas==2.2.3 numpy==2.2.2 scipy==1.15.1 pytest
      - run: pytest tests/python -v
