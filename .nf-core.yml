repository_type: pipeline

nf_core_version: 4.2.1

lint:
  files_unchanged:
    - .prettierignore
    - docs/CONTRIBUTING.md
    - assets/sendmail_template.txt
    - .prettierignore
    - CODE_OF_CONDUCT.md
    - assets/nf-core-gencorr_logo_light.png
    - docs/images/nf-core-gencorr_logo_light.png
    - docs/images/nf-core-gencorr_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - README.md
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config: false
  files_exist:
    - assets/multiqc_config.yml
    - assets/email_template.html
    - assets/sendmail_template.txt
    - assets/email_template.txt
    - CODE_OF_CONDUCT.md
    - assets/nf-core-gencorr_logo_light.png
    - docs/images/nf-core-gencorr_logo_light.png
    - docs/images/nf-core-gencorr_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - conf/igenomes.config
    - conf/igenomes_ignored.config
  readme:
    - nextflow_badge
    - nfcore_template_badge

template:
  org: mauricioroza
  name: gencorr
  description: Global (LDSC) and local (LAVA) genetic correlation from GWAS summary
    statistics, with a pluggable method interface
  author: MR, Genis
  version: 0.1.0dev
  force: true
  skip_features:
    - igenomes
    - multiqc
    - fastqc
    - seqera_platform
    - gpu
    - codespaces
    - rocrate
    - email
    - github_badges
  is_nfcore: false
