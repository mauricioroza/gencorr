name: "harmonize_sumstats"
description: Convert one GWAS summary statistics file to the gencorr harmonized
  format (SNP CHR BP A1 A2 Z BETA SE P N EAF INFO) and write a QC report
keywords:
  - gwas
  - summary statistics
  - harmonization
  - quality control
tools:
  - gencorr:
      description: gencorr helper scripts (bin/harmonize_sumstats.py; Python with
        pandas, numpy and scipy)
      homepage: "https://github.com/mauricioroza/gencorr"
      documentation: "https://github.com/mauricioroza/gencorr/blob/dev/docs/usage.md"
      licence: ["MIT"]
      identifier: ""
      args_id: "$args"
input:
  - - meta:
        type: map
        description: |
          Trait meta map. id is required; n, n_cases, n_controls and colmap
          (JSON column mapping) are optional. e.g. [ id:'bmi', n:500000 ]
    - sumstats:
        type: file
        description: Raw GWAS summary statistics for one trait, one variant per
          row, in any common column naming
        pattern: "*.{txt,tsv,csv}{,.gz}"
        ontologies:
          - edam: "http://edamontology.org/format_3475" # TSV
output:
  sumstats:
    - - meta:
          type: map
          description: Trait meta map, as given
      - ${prefix}.harmonized.tsv.gz:
          type: file
          description: Harmonized summary statistics with the gencorr columns,
            one row per kept variant; the only input every method reads
          pattern: "*.harmonized.tsv.gz"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
            - edam: "http://edamontology.org/format_3989" # GZIP format
  qc:
    - - meta:
          type: map
          description: Trait meta map, as given
      - ${prefix}.qc.json:
          type: file
          description: QC report with the column mapping used, the source of Z,
            variants removed per filter and lambda GC
          pattern: "*.qc.json"
          ontologies:
            - edam: "http://edamontology.org/format_3464" # JSON
  versions_python:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - "python3 -c 'import platform; print(platform.python_version())'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_pandas:
    - - ${task.process}:
          type: string
          description: The name of the process
      - pandas:
          type: string
          description: The name of the tool
      - "python3 -c 'import pandas; print(pandas.__version__)'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_numpy:
    - - ${task.process}:
          type: string
          description: The name of the process
      - numpy:
          type: string
          description: The name of the tool
      - "python3 -c 'import numpy; print(numpy.__version__)'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_scipy:
    - - ${task.process}:
          type: string
          description: The name of the process
      - scipy:
          type: string
          description: The name of the tool
      - "python3 -c 'import scipy; print(scipy.__version__)'":
          type: eval
          description: The expression to obtain the version of the tool
