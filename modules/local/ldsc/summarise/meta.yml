name: "ldsc_summarise"
description: Parse LDSC h2 and rg logs into the standard results table, a
  per-trait heritability table and the LAVA sample-overlap matrix
keywords:
  - ldsc
  - genetic correlation
  - heritability
  - parsing
tools:
  - gencorr:
      description: gencorr helper scripts (bin/parse_ldsc.py; Python with pandas
        and numpy)
      homepage: "https://github.com/mauricioroza/gencorr"
      documentation: "https://github.com/mauricioroza/gencorr/blob/dev/docs/output.md"
      licence: ["MIT"]
      identifier: ""
      args_id: "$args"
input:
  - h2_logs:
      type: file
      description: LDSC --h2 logs for every trait (<id>.h2.log, and <id>.h2_liab.log
        for binary traits with a population prevalence)
      pattern: "*.h2*.log"
      ontologies:
        - edam: "http://edamontology.org/format_2330" # Textual format
  - rg_logs:
      type: file
      description: LDSC --rg logs (<batch>.rg.log); pass [] for none
      pattern: "*.rg.log"
      ontologies:
        - edam: "http://edamontology.org/format_2330" # Textual format
output:
  results:
    - gencorr.ldsc.tsv:
        type: file
        description: Standard results table with one global rg row per trait pair
        pattern: "gencorr.ldsc.tsv"
        ontologies:
          - edam: "http://edamontology.org/format_3475" # TSV
  h2:
    - gencorr.ldsc_h2.tsv:
        type: file
        description: Per-trait heritability (observed and liability scale),
          intercept, ratio, lambda GC and mean chi-square
        pattern: "gencorr.ldsc_h2.tsv"
        ontologies:
          - edam: "http://edamontology.org/format_3475" # TSV
  overlap:
    - gencorr.sample_overlap.txt:
        type: file
        description: Sampling-correlation matrix from the LDSC intercepts, in the
          format LAVA reads (LAVA vignette recipe)
        pattern: "gencorr.sample_overlap.txt"
        ontologies:
          - edam: "http://edamontology.org/format_2330" # Textual format
  versions_python:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - "python3 -c 'import platform; print(platform.python_version())'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_pandas:
    - - ${task.process}:
          type: string
          description: The name of the process
      - pandas:
          type: string
          description: The name of the tool
      - "python3 -c 'import pandas; print(pandas.__version__)'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_numpy:
    - - ${task.process}:
          type: string
          description: The name of the process
      - numpy:
          type: string
          description: The name of the tool
      - "python3 -c 'import numpy; print(numpy.__version__)'":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - "python3 -c 'import platform; print(platform.python_version())'":
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - pandas:
          type: string
          description: The name of the tool
      - "python3 -c 'import pandas; print(pandas.__version__)'":
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - numpy:
          type: string
          description: The name of the tool
      - "python3 -c 'import numpy; print(numpy.__version__)'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
