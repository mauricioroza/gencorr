name: "ldsc_h2"
description: LDSC SNP heritability of one trait on the observed scale, plus the
  liability scale for binary traits with n_cases, n_controls and pop_prev
keywords:
  - ldsc
  - gwas
  - heritability
tools:
  - ldsc:
      description: LD Score Regression, for SNP heritability and genetic
        correlation from GWAS summary statistics
      homepage: "https://github.com/bulik/ldsc"
      documentation: "https://github.com/bulik/ldsc/wiki"
      tool_dev_url: "https://github.com/bulik/ldsc"
      doi: "10.1038/ng.3211"
      licence: ["GPL-3.0-only"]
      identifier: ""
      args_id: "$args"
input:
  - - meta:
        type: map
        description: |
          Trait meta map. id is required; n_cases, n_controls and pop_prev
          enable the liability-scale run. e.g. [ id:'depression', n_cases:170756,
          n_controls:329443, pop_prev:0.15 ]
    - sumstats:
        type: file
        description: Munged summary statistics from LDSC_MUNGE
        pattern: "*.sumstats.gz"
        ontologies:
          - edam: "http://edamontology.org/format_3475" # TSV
  - - ld:
        type: map
        description: LD score meta map; prefix is the file prefix inside the
          directories, split_by_chr selects --ref-ld-chr/--w-ld-chr. e.g.
          [ prefix:'', split_by_chr:true ]
    - ref_ld:
        type: directory
        description: Directory with the reference LD scores (e.g. eur_w_ld_chr)
    - w_ld:
        type: directory
        description: Directory with the regression-weight LD scores (often the
          same as ref_ld)
output:
  log:
    - - meta:
          type: map
          description: Trait meta map, as given
      - ${meta.id}.h2*.log:
          type: file
          description: LDSC --h2 log (<id>.h2.log) and, for binary traits with a
            population prevalence, the liability-scale log (<id>.h2_liab.log)
          pattern: "*.h2*.log"
          ontologies:
            - edam: "http://edamontology.org/format_2330" # Textual format
  versions_ldsc:
    - - ${task.process}:
          type: string
          description: The name of the process
      - ldsc:
          type: string
          description: The name of the tool
      - "grep -m1 -o 'Version [0-9.]*' ${meta.id}.h2.log | cut -d' ' -f2":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - ldsc:
          type: string
          description: The name of the tool
      - "grep -m1 -o 'Version [0-9.]*' ${meta.id}.h2.log | cut -d' ' -f2":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@mauricioroza"
maintainers:
  - "@mauricioroza"
